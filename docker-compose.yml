# =============================================================================
# Blockchain-Secured Federated Learning – docker-compose.yml
# Full N-bank deployment. N is controlled by docker-compose profiles or
# the Makefile wrapper. Default: 5 banks.
# =============================================================================
version: "3.9"

# ---------------------------------------------------------------------------
# Shared networks
# ---------------------------------------------------------------------------
networks:
  fabric_net:
    driver: bridge
  ipfs_private:
    driver: bridge
  fl_net:
    driver: bridge
  dashboard_net:
    driver: bridge

# ---------------------------------------------------------------------------
# Shared volumes
# ---------------------------------------------------------------------------
volumes:
  # Orderer data
  orderer0_data:
  orderer1_data:
  orderer2_data:

  # Per-bank data volumes (mounted read-only into FL nodes, read-write only
  # from the bank's own data-init container). These are NEVER shared across banks.
  bank0_data:
  bank1_data:
  bank2_data:
  bank3_data:
  bank4_data:

  # Per-bank peer state
  peer0_bank0_data:
  peer0_bank1_data:
  peer0_bank2_data:
  peer0_bank3_data:
  peer0_bank4_data:

  # IPFS private swarm shared volume (encrypted artifacts only)
  ipfs_bank0_data:
  ipfs_bank1_data:
  ipfs_bank2_data:
  ipfs_bank3_data:
  ipfs_bank4_data:

  # CA data
  ca_bank0_data:
  ca_bank1_data:
  ca_bank2_data:
  ca_bank3_data:
  ca_bank4_data:

  # Results
  results_data:

# ---------------------------------------------------------------------------
# Orderer nodes (Raft consensus, 3 nodes)
# ---------------------------------------------------------------------------
services:

  orderer0:
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:17050
    volumes:
      - ./fabric/crypto-config/ordererOrganizations/orderer.fraud.net/orderers/orderer0.orderer.fraud.net/msp:/var/hyperledger/orderer/msp
      - ./fabric/crypto-config/ordererOrganizations/orderer.fraud.net/orderers/orderer0.orderer.fraud.net/tls:/var/hyperledger/orderer/tls
      - orderer0_data:/var/hyperledger/production/orderer
    networks:
      - fabric_net
    ports:
      - "7050:7050"
      - "7053:7053"

  orderer1:
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=8050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:8053
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:17051
    volumes:
      - ./fabric/crypto-config/ordererOrganizations/orderer.fraud.net/orderers/orderer1.orderer.fraud.net/msp:/var/hyperledger/orderer/msp
      - ./fabric/crypto-config/ordererOrganizations/orderer.fraud.net/orderers/orderer1.orderer.fraud.net/tls:/var/hyperledger/orderer/tls
      - orderer1_data:/var/hyperledger/production/orderer
    networks:
      - fabric_net
    ports:
      - "8050:8050"
      - "8053:8053"

  orderer2:
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=9050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:9053
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:17052
    volumes:
      - ./fabric/crypto-config/ordererOrganizations/orderer.fraud.net/orderers/orderer2.orderer.fraud.net/msp:/var/hyperledger/orderer/msp
      - ./fabric/crypto-config/ordererOrganizations/orderer.fraud.net/orderers/orderer2.orderer.fraud.net/tls:/var/hyperledger/orderer/tls
      - orderer2_data:/var/hyperledger/production/orderer
    networks:
      - fabric_net
    ports:
      - "9050:9050"
      - "9053:9053"

  # ---------------------------------------------------------------------------
  # Bank 0 – Fabric CA + Peer + IPFS + FL node
  # ---------------------------------------------------------------------------
  ca.bank0.fraud.net:
    image: hyperledger/fabric-ca:1.5
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca.bank0.fraud.net
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
    volumes:
      - ca_bank0_data:/etc/hyperledger/fabric-ca-server
    networks:
      - fabric_net
    ports:
      - "7054:7054"

  peer0.bank0.fraud.net:
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_PEER_ID=peer0.bank0.fraud.net
      - CORE_PEER_ADDRESS=peer0.bank0.fraud.net:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.bank0.fraud.net:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.bank0.fraud.net:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.bank0.fraud.net:7051
      - CORE_PEER_LOCALMSPID=Bank0MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:17061
      - CORE_METRICS_PROVIDER=prometheus
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fyp_fabric_net
      - FABRIC_LOGGING_SPEC=INFO
    volumes:
      - ./fabric/crypto-config/peerOrganizations/bank0.fraud.net/peers/peer0.bank0.fraud.net/msp:/etc/hyperledger/fabric/msp
      - ./fabric/crypto-config/peerOrganizations/bank0.fraud.net/peers/peer0.bank0.fraud.net/tls:/etc/hyperledger/fabric/tls
      - peer0_bank0_data:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
    networks:
      - fabric_net
    ports:
      - "7051:7051"
    depends_on:
      - orderer0

  ipfs-bank0:
    image: ipfs/kubo:v0.26.0
    environment:
      - IPFS_SWARM_KEY_FILE=/data/ipfs/swarm.key
    volumes:
      - ipfs_bank0_data:/data/ipfs
      - ./fabric/scripts/swarm.key:/data/ipfs/swarm.key:ro
    networks:
      - ipfs_private
    ports:
      - "4001:4001"
      - "5001:5001"

  fl-bank0:
    build:
      context: ./fl
      dockerfile: Dockerfile
    environment:
      - BANK_ID=0
      - N_BANKS=5
      - FABRIC_PEER_ENDPOINT=peer0.bank0.fraud.net:7051
      - IPFS_API_URL=http://ipfs-bank0:5001
      - DATA_PATH=/data/bank0
      - RESULTS_PATH=/results
      - PYTHONUNBUFFERED=1
    volumes:
      - bank0_data:/data/bank0:ro        # READ-ONLY: bank data never leaves this volume
      - results_data:/results
      - ./fabric/crypto-config/peerOrganizations/bank0.fraud.net:/crypto:ro
    networks:
      - fl_net
      - fabric_net
      - ipfs_private
    depends_on:
      - peer0.bank0.fraud.net
      - ipfs-bank0

