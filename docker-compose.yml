      - ./fabric/crypto-config/peerOrganizations/bank4.fraud.net/peers/peer0.bank4.fraud.net/tls:/etc/hyperledger/fabric/tls
      - peer0_bank4_data:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
    networks:
      - fabric_net
    ports:
      - "11051:11051"
    depends_on:
      - orderer0

  ipfs-bank4:
    image: ipfs/kubo:v0.26.0
    volumes:
      - ipfs_bank4_data:/data/ipfs
      - ./fabric/scripts/swarm.key:/data/ipfs/swarm.key:ro
    networks:
      - ipfs_private
    ports:
      - "4041:4001"
      - "5041:5001"

  fl-bank4:
    build:
      context: ./fl
      dockerfile: Dockerfile
    environment:
      - BANK_ID=4
      - N_BANKS=5
      - FABRIC_PEER_ENDPOINT=peer0.bank4.fraud.net:11051
      - IPFS_API_URL=http://ipfs-bank4:5001
      - DATA_PATH=/data/bank4
      - RESULTS_PATH=/results
    volumes:
      - bank4_data:/data/bank4:ro
      - results_data:/results
      - ./fabric/crypto-config/peerOrganizations/bank4.fraud.net:/crypto:ro
    networks:
      - fl_net
      - fabric_net
      - ipfs_private
    depends_on:
      - peer0.bank4.fraud.net
      - ipfs-bank4

  # ---------------------------------------------------------------------------
  # Dashboard
  # ---------------------------------------------------------------------------
  dashboard-api:
    build:
      context: ./dashboard/backend
      dockerfile: Dockerfile
    environment:
      - FABRIC_PEER_ENDPOINT=peer0.bank0.fraud.net:7051
      - N_BANKS=5
      - RESULTS_PATH=/results
    volumes:
      - results_data:/results:ro
      - ./fabric/crypto-config:/crypto:ro
    networks:
      - dashboard_net
      - fabric_net
    ports:
      - "8000:8000"
    depends_on:
      - peer0.bank0.fraud.net

  dashboard-ui:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    networks:
      - dashboard_net
    ports:
      - "3000:80"
    depends_on:
      - dashboard-api
