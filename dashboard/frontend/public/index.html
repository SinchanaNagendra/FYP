<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FL Fraud Detection Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
nav{background:#1e293b;border-bottom:1px solid #334155;padding:12px 24px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.logo{font-weight:700;font-size:17px;color:#60a5fa;margin-right:12px;white-space:nowrap}
.nav-btn{cursor:pointer;padding:6px 14px;border-radius:6px;border:1px solid transparent;background:transparent;color:#94a3b8;font-size:13px;transition:all .15s}
.nav-btn:hover,.nav-btn.active{background:#334155;color:#f1f5f9;border-color:#475569}
.page{padding:24px;max-width:1300px;margin:0 auto}
h2{font-size:20px;font-weight:600;margin-bottom:4px}
.sub{font-size:13px;color:#64748b;margin-bottom:20px}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:18px;margin-bottom:16px}
.card-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#64748b;margin-bottom:12px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.stat{font-size:30px;font-weight:700;color:#f1f5f9}
.stat-lbl{font-size:12px;color:#64748b;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;border-bottom:2px solid #334155;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #1e293b20;white-space:nowrap}
tr:hover td{background:#ffffff08}
.badge{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600;display:inline-block}
.bg{background:#166534;color:#86efac}
.bb{background:#1e3a5f;color:#93c5fd}
.by{background:#713f12;color:#fde68a}
.br{background:#7f1d1d;color:#fca5a5}
.tag{font-family:monospace;font-size:11px;background:#1e3a5f22;color:#93c5fd;padding:2px 6px;border-radius:3px}
.bar-wrap{background:#334155;border-radius:4px;height:8px;overflow:hidden;margin-top:4px}
.bar{height:100%;border-radius:4px;background:#60a5fa;transition:width .5s}
.empty{color:#475569;text-align:center;padding:48px;font-size:14px}
.mr{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1e293b44;font-size:13px}
.mr:last-child{border:none}
.mk{color:#94a3b8}.mv{font-weight:600;font-family:monospace}
.inv-ok{border-color:#166534!important}
.inv-bad{border-color:#991b1b!important}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.dot-g{background:#22c55e}.dot-b{background:#60a5fa}.dot-y{background:#f59e0b}
/* SVG chart */
.chart-svg{width:100%;overflow-x:auto}
</style>
</head>
<body>
<nav>
  <span class="logo">🔒 FL Fraud Dashboard</span>
  <button class="nav-btn active" onclick="go('overview',this)">Overview</button>
  <button class="nav-btn" onclick="go('baselines',this)">Baselines</button>
  <button class="nav-btn" onclick="go('federated',this)">Federated</button>
  <button class="nav-btn" onclick="go('convergence',this)">Convergence</button>
  <button class="nav-btn" onclick="go('banks',this)">Banks</button>
  <button class="nav-btn" onclick="go('noniid',this)">Non-IID</button>
  <button class="nav-btn" onclick="go('boundary',this)">Data Boundary</button>
  <span style="margin-left:auto;font-size:11px;color:#475569">IEEE-CIS · 590K txns · 5 banks · S1/S3</span>
</nav>
<div id="app"></div>

<script>
let D = {};

// ── helpers ───────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const f4 = v => (v==null||v===undefined) ? '—' : Number(v).toFixed(4);
const f2 = v => (v==null||v===undefined) ? '—' : Number(v).toFixed(2);
const pct = v => (v==null||v===undefined) ? '—' : (Number(v)*100).toFixed(2)+'%';

function badge(v, thresholds=[0.5,0.35]) {
  if (v==null) return '<span class="badge by">N/A</span>';
  const n=Number(v);
  const cls = n>=thresholds[0]?'bg':n>=thresholds[1]?'bb':'by';
  return `<span class="badge ${cls}">${f4(n)}</span>`;
}

function modelShort(m) {
  return {logistic_regression:'Log Reg',cnn:'CNN',gaussian_nb:'GNB',
          decision_tree:'Dec Tree',random_forest:'Rand Forest',knn:'KNN'}[m]||m;
}

// ── tab routing ───────────────────────────────────────────────────────────
function go(tab, btn) {
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const renders = {overview,baselines,federated,convergence,banks,noniid,boundary};
  $('app').innerHTML = renders[tab] ? renders[tab]() : '<div class="page empty">Coming soon</div>';
}

// ── OVERVIEW ──────────────────────────────────────────────────────────────
function overview() {
  const fl = D.fl_comparison||[];
  const rfS1 = fl.find(r=>r.model==='random_forest'&&r.scenario==='S1');
  const lrS1 = fl.find(r=>r.model==='logistic_regression'&&r.scenario==='S1');
  const rfS3 = fl.find(r=>r.scenario==='S3_a0.1');

  const central = D.central_table||[];
  const rfC = central.find(r=>r.model==='random_forest'&&r.balancing==='none');
  const lrC = central.find(r=>r.model==='logistic_regression'&&r.balancing==='none');

  const gap_rf = rfS1&&rfC ? (rfS1.pr_auc_mean-rfC.pr_auc).toFixed(4) : '—';
  const gap_lr = lrS1&&lrC ? (lrS1.pr_auc_mean-lrC.pr_auc).toFixed(4) : '—';

  return `<div class="page">
  <h2>System Overview</h2>
  <p class="sub">Blockchain-Secured Federated Learning · IEEE-CIS Fraud Detection · 5 banks · No raw data shared</p>

  <div class="grid3" style="margin-bottom:16px">
    <div class="card">
      <div class="stat">${rfS1 ? rfS1.pr_auc_mean : '—'}</div>
      <div class="stat-lbl">Best Federated PR-AUC (RF, S1 IID)</div>
      <div class="bar-wrap"><div class="bar" style="width:${rfS1?rfS1.pr_auc_mean*100:0}%"></div></div>
    </div>
    <div class="card">
      <div class="stat">${rfC ? rfC.pr_auc : '—'}</div>
      <div class="stat-lbl">Centralized Baseline PR-AUC (RF)</div>
      <div class="bar-wrap"><div class="bar" style="width:${rfC?rfC.pr_auc*100:0}%;background:#34d399"></div></div>
    </div>
    <div class="card">
      <div class="stat" style="color:${gap_rf>0?'#86efac':'#fca5a5'}">${gap_rf>0?'+':''}${gap_rf}</div>
      <div class="stat-lbl">Federated vs Centralized Gap (RF)</div>
      <div class="sub" style="margin:8px 0 0">Positive = federated beats centralized</div>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="card-title">Federated vs Centralized — All Models</div>
      <table>
        <thead><tr><th>Model</th><th>Central PR-AUC</th><th>Fed PR-AUC</th><th>Gap</th></tr></thead>
        <tbody>
          ${fl.filter(r=>r.scenario==='S1').map(r=>{
            const c = central.find(x=>x.model===r.model&&x.balancing==='none');
            const gap = c ? (r.pr_auc_mean-c.pr_auc) : null;
            return `<tr>
              <td>${modelShort(r.model)}</td>
              <td>${c?f4(c.pr_auc):'—'}</td>
              <td>${badge(r.pr_auc_mean)}</td>
              <td style="color:${gap>0?'#86efac':gap<-0.01?'#fca5a5':'#94a3b8'}">${gap!=null?(gap>0?'+':'')+gap.toFixed(4):'—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <div class="card">
      <div class="card-title">Key System Facts</div>
      <div class="mr"><span class="mk">Dataset</span><span class="mv">IEEE-CIS (590K transactions)</span></div>
      <div class="mr"><span class="mk">Fraud rate</span><span class="mv">3.5% (majority-class acc = 96.5%)</span></div>
      <div class="mr"><span class="mk">Banks</span><span class="mv">5 (simulated via uid partitioning)</span></div>
      <div class="mr"><span class="mk">Scenarios</span><span class="mv">S1 IID, S3 Dirichlet α=0.1</span></div>
      <div class="mr"><span class="mk">Secure aggregation</span><span class="mv">X25519 + PRG masks (verified)</span></div>
      <div class="mr"><span class="mk">Raw data transmitted</span><span class="mv" style="color:#86efac">0 bytes ✅</span></div>
      <div class="mr"><span class="mk">Primary metric</span><span class="mv">PR-AUC (not accuracy)</span></div>
      <div class="mr"><span class="mk">Blockchain</span><span class="mv">Hyperledger Fabric 2.5 (code ready)</span></div>
    </div>
  </div>
  </div>`;
}

// ── BASELINES ─────────────────────────────────────────────────────────────
function baselines() {
  const rows = D.central_table||[];
  const grouped = {};
  rows.forEach(r=>{ if(!grouped[r.model]) grouped[r.model]=[]; grouped[r.model].push(r); });

  return `<div class="page">
  <h2>Centralized Baselines</h2>
  <p class="sub">All 6 models trained on pooled data (413K rows). Majority-class accuracy = 96.51% (always predict non-fraud).</p>
  <div class="card">
    <table>
      <thead><tr><th>Model</th><th>Balancing</th><th>PR-AUC ↑</th><th>ROC-AUC</th><th>F1</th><th>Accuracy</th><th>Maj-class acc</th><th>Time</th></tr></thead>
      <tbody>
        ${rows.map(r=>`<tr>
          <td>${modelShort(r.model)}</td>
          <td><span class="tag">${r.balancing}</span></td>
          <td>${badge(r.pr_auc)}</td>
          <td>${f4(r.roc_auc)}</td>
          <td>${f4(r.f1)}</td>
          <td>${f4(r.accuracy)}</td>
          <td style="color:#64748b">${f4(r.majority_acc)}</td>
          <td>${f2(r.train_time)}s</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>
  <div class="card" style="border-color:#334155">
    <div class="card-title">Key observations</div>
    <div class="mr"><span class="mk">Best model</span><span class="mv" style="color:#86efac">Random Forest (PR-AUC 0.40, ROC-AUC 0.86)</span></div>
    <div class="mr"><span class="mk">Worst model</span><span class="mv">GNB (PR-AUC 0.03 — Gaussian assumption violated)</span></div>
    <div class="mr"><span class="mk">Accuracy is misleading</span><span class="mv">96.5% by always predicting non-fraud — use PR-AUC</span></div>
    <div class="mr"><span class="mk">RUS helps ROC-AUC</span><span class="mv">Random under-sampling improves recall at cost of precision</span></div>
  </div>
  </div>`;
}

// ── FEDERATED ─────────────────────────────────────────────────────────────
function federated() {
  const fl = D.fl_comparison||[];
  const central = D.central_table||[];

  return `<div class="page">
  <h2>Federated Learning Results</h2>
  <p class="sub">No raw data shared between banks. Secure aggregation (X25519 + PRG masks) used for LR. Tree models use federated bagging.</p>
  <div class="card">
    <table>
      <thead><tr><th>Model</th><th>Scenario</th><th>Rounds</th><th>Fed PR-AUC (mean±std)</th><th>Fed ROC-AUC</th><th>Central PR-AUC</th><th>Gap</th></tr></thead>
      <tbody>
        ${fl.map(r=>{
          const c = central.find(x=>x.model===r.model&&x.balancing==='none');
          const gap = c ? r.pr_auc_mean-c.pr_auc : null;
          const scenLabel = r.scenario==='S3_a0.1'?'<span class="badge by">S3 α=0.1</span>':'<span class="badge bb">S1 IID</span>';
          return `<tr>
            <td>${modelShort(r.model)}</td>
            <td>${scenLabel}</td>
            <td>${r.n_rounds}</td>
            <td>${badge(r.pr_auc_mean)} <span style="color:#475569;font-size:11px">±${r.pr_auc_std}</span></td>
            <td>${f4(r.roc_auc_mean)}</td>
            <td>${c?f4(c.pr_auc):'—'}</td>
            <td style="color:${gap>0?'#86efac':gap<-0.01?'#fca5a5':'#94a3b8'};font-weight:600">${gap!=null?(gap>0?'+':'')+gap.toFixed(4):'—'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>
  <div class="grid2">
    <div class="card">
      <div class="card-title">Federation mechanism per model</div>
      <div class="mr"><span class="mk">Logistic Regression</span><span class="mv">FedAvg on weights + SecureAgg</span></div>
      <div class="mr"><span class="mk">Random Forest</span><span class="mv">Federated bagging (tree union)</span></div>
      <div class="mr"><span class="mk">Gaussian NB</span><span class="mv">Exact sufficient-stat aggregation</span></div>
      <div class="mr"><span class="mk">KNN</span><span class="mv" style="color:#fca5a5">NOT federated — privacy violation</span></div>
    </div>
    <div class="card">
      <div class="card-title">Why federated ≥ centralized here</div>
      <div class="mr"><span class="mk">RF +0.037</span><span class="mv">More trees = better ensemble (bagging)</span></div>
      <div class="mr"><span class="mk">LR +0.146</span><span class="mv">Diverse bank distributions improve generalisation</span></div>
      <div class="mr"><span class="mk">S3 vs S1</span><span class="mv">High variance (±0.38) shows non-IID challenge</span></div>
    </div>
  </div>
  </div>`;
}

// ── CONVERGENCE ───────────────────────────────────────────────────────────
function convergence() {
  const rm = D.round_metrics||[];
  if (!rm.length) return `<div class="page"><div class="empty">No round data available.</div></div>`;

  const W=700, H=180, pl=45, pr=20, pt=20, pb=35;
  const iW=W-pl-pr, iH=H-pt-pb;
  const vals = rm.map(r=>r.mean_pr_auc||0);
  const minV=Math.min(...vals)-0.02, maxV=Math.max(...vals)+0.02;
  const clamp = v => Math.max(0,Math.min(1,(v-minV)/(maxV-minV)));
  const x = i => pl + (i/(rm.length-1||1))*iW;
  const y = v => pt + (1-clamp(v))*iH;

  const pts = rm.map((r,i)=>`${x(i)},${y(r.mean_pr_auc||0)}`).join(' ');
  const area = `${pl},${pt+iH} `+rm.map((r,i)=>`${x(i)},${y(r.mean_pr_auc||0)}`).join(' ')+` ${x(rm.length-1)},${pt+iH}`;

  const yLabels = [0.25,0.35,0.45].map(v=>`
    <text x="${pl-6}" y="${y(v)+4}" text-anchor="end" fill="#64748b" font-size="10">${v.toFixed(2)}</text>
    <line x1="${pl}" y1="${y(v)}" x2="${W-pr}" y2="${y(v)}" stroke="#334155" stroke-width="0.5"/>`).join('');

  const xLabels = rm.filter((_,i)=>i%2===0||i===rm.length-1).map((r,_,arr)=>{
    const i = rm.indexOf(r);
    return `<text x="${x(i)}" y="${H-5}" text-anchor="middle" fill="#64748b" font-size="10">R${r.round}</text>`;
  }).join('');

  const dots = rm.map((r,i)=>`
    <circle cx="${x(i)}" cy="${y(r.mean_pr_auc||0)}" r="4" fill="#60a5fa" stroke="#0f172a" stroke-width="1.5"/>
    <title>Round ${r.round}: PR-AUC=${r.mean_pr_auc}, Time=${r.time}s</title>`).join('');

  const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;display:block">
    <polygon points="${area}" fill="#60a5fa" fill-opacity="0.08"/>
    <polyline points="${pts}" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linejoin="round"/>
    ${yLabels}${xLabels}${dots}
    <text x="${pl-2}" y="${pt-6}" fill="#60a5fa" font-size="11">● PR-AUC (val, mean across 5 banks)</text>
  </svg>`;

  const tableRows = rm.map(r=>`<tr>
    <td>Round ${r.round}</td>
    <td>${badge(r.mean_pr_auc)}</td>
    <td>${f2(r.time)}s</td>
    <td>${r.mean_pr_auc && rm[0].mean_pr_auc ? (r.mean_pr_auc>rm[0].mean_pr_auc?'<span style="color:#86efac">▲ improving</span>':'<span style="color:#94a3b8">stable</span>') : '—'}</td>
  </tr>`).join('');

  return `<div class="page">
  <h2>Convergence — Logistic Regression (10 Rounds, S1 IID)</h2>
  <p class="sub">Mean PR-AUC across all 5 banks per round. Secure aggregation active (X25519 + PRG masks).</p>
  <div class="card">${svg}</div>
  <div class="card">
    <table>
      <thead><tr><th>Round</th><th>Mean PR-AUC</th><th>Round time</th><th>Trend</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
  </div>
  </div>`;
}

// ── BANKS ─────────────────────────────────────────────────────────────────
function banks() {
  const bm = D.bank_metrics||[];
  if (!bm.length) return `<div class="page"><div class="empty">No bank data.</div></div>`;

  const cards = bm.map(b=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <span style="font-weight:700;font-size:18px">Bank ${b.bank_id}</span>
        <span class="badge bg">active</span>
      </div>
      <div class="mr"><span class="mk">PR-AUC</span><span class="mv">${f4(b.pr_auc)}</span></div>
      <div class="mr"><span class="mk">ROC-AUC</span><span class="mv">${f4(b.roc_auc)}</span></div>
      <div class="mr"><span class="mk">F1</span><span class="mv">${f4(b.f1)}</span></div>
      <div class="mr"><span class="mk">Recall</span><span class="mv">${f4(b.recall)}</span></div>
      <div class="mr"><span class="mk">Fraud rate</span><span class="mv">${pct(b.fraud_rate)}</span></div>
      <div class="mr"><span class="mk">Test samples</span><span class="mv">${(b.n_samples||0).toLocaleString()}</span></div>
      <div class="bar-wrap" style="margin-top:8px"><div class="bar" style="width:${(b.pr_auc||0)*100}%"></div></div>
    </div>`).join('');

  const mean_pr = (bm.reduce((s,b)=>s+(b.pr_auc||0),0)/bm.length).toFixed(4);
  const max_pr = Math.max(...bm.map(b=>b.pr_auc||0)).toFixed(4);
  const min_pr = Math.min(...bm.map(b=>b.pr_auc||0)).toFixed(4);

  return `<div class="page">
  <h2>Per-Bank Results — Random Forest, S1 IID</h2>
  <p class="sub">Each bank evaluated on its own local test set. Model = federated bagging union of all 5 banks' forests.</p>
  <div class="grid3" style="margin-bottom:16px">
    <div class="card"><div class="stat">${mean_pr}</div><div class="stat-lbl">Mean PR-AUC across banks</div></div>
    <div class="card"><div class="stat" style="color:#86efac">${max_pr}</div><div class="stat-lbl">Best bank PR-AUC</div></div>
    <div class="card"><div class="stat" style="color:#fde68a">${min_pr}</div><div class="stat-lbl">Worst bank PR-AUC</div></div>
  </div>
  <div class="grid5">${cards}</div>
  </div>`;
}

// ── NON-IID ───────────────────────────────────────────────────────────────
function noniid() {
  const s1 = D.bank_metrics||[];
  const s3 = D.s3_bank_metrics||[];

  const tableS1 = s1.map(b=>`<tr>
    <td>Bank ${b.bank_id}</td>
    <td>${pct(b.fraud_rate)}</td>
    <td>${badge(b.pr_auc)}</td>
    <td>${f4(b.roc_auc)}</td>
  </tr>`).join('');

  const tableS3 = s3.map(b=>`<tr>
    <td>Bank ${b.bank_id}</td>
    <td style="color:${(b.fraud_rate||0)>0.2?'#fca5a5':(b.fraud_rate||0)<0.01?'#fde68a':'#94a3b8'}">${pct(b.fraud_rate)}</td>
    <td>${badge(b.pr_auc,[0.4,0.2])}</td>
    <td>${(b.n_samples||0).toLocaleString()}</td>
  </tr>`).join('');

  return `<div class="page">
  <h2>Non-IID Analysis — S1 IID vs S3 Dirichlet (α=0.1)</h2>
  <p class="sub">Dirichlet α=0.1 creates severe label and quantity skew. One bank gets ~40% fraud rate; another gets ~0.5%. This is the core federated learning challenge.</p>
  <div class="grid2">
    <div class="card">
      <div class="card-title"><span class="dot dot-b"></span>S1 — IID (Random assignment)</div>
      <table>
        <thead><tr><th>Bank</th><th>Fraud rate</th><th>PR-AUC</th><th>ROC-AUC</th></tr></thead>
        <tbody>${tableS1}</tbody>
      </table>
      <div style="margin-top:12px;font-size:12px;color:#64748b">
        Low variance: all banks have similar fraud rates (~3%). PR-AUC std = 0.09
      </div>
    </div>
    <div class="card">
      <div class="card-title"><span class="dot dot-y"></span>S3 — Dirichlet α=0.1 (Extreme skew)</div>
      <table>
        <thead><tr><th>Bank</th><th>Fraud rate</th><th>PR-AUC</th><th>Samples</th></tr></thead>
        <tbody>${tableS3||'<tr><td colspan=4 style="color:#64748b;text-align:center">Loading...</td></tr>'}</tbody>
      </table>
      <div style="margin-top:12px;font-size:12px;color:#64748b">
        High variance: PR-AUC std = 0.38. FedProx (μ>0) would reduce this gap.
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">What this means for your report</div>
    <div class="mr"><span class="mk">S1 IID mean PR-AUC</span><span class="mv" style="color:#86efac">0.436 ± 0.090</span></div>
    <div class="mr"><span class="mk">S3 α=0.1 mean PR-AUC</span><span class="mv" style="color:#fde68a">0.329 ± 0.380</span></div>
    <div class="mr"><span class="mk">Key finding</span><span class="mv">Non-IID degrades average performance AND creates unfair bank-level disparity</span></div>
    <div class="mr"><span class="mk">Solution direction</span><span class="mv">FedProx, per-bank class weighting, or data-free knowledge distillation</span></div>
  </div>
  </div>`;
}

// ── DATA BOUNDARY ─────────────────────────────────────────────────────────
function boundary() {
